<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | SAI Goods Store</title>
    <meta
      name="description"
      content="Enter your shipping address, review tax and total, and pay securely with Square."
    />
    <meta name="robots" content="noindex, follow" />
    <!-- Perf: critical shell + checkout placeholder height (CLS) until async styles.css -->
    <style>
      :root {
        --bg: #f7f4ee;
        --text: #25242a;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 0.65rem 0;
        background: #fff;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .navbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 1.5rem;
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .section {
        padding: 1.5rem 0;
      }
      .shell {
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .checkout-loading {
        min-height: 12rem;
        padding: 2.5rem;
        text-align: center;
      }
    </style>
    <link rel="stylesheet" href="/css/styles.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="/css/styles.css" /></noscript>
  </head>
  <body class="page--checkout">
    <div class="site-frame">
      <header data-site-header></header>

      <main class="section section--tight">
        <div class="shell">
          <div data-checkout-root>
            <p class="checkout-loading">Loading checkout…</p>
          </div>
        </div>
      </main>

      <footer data-site-footer></footer>
    </div>

    <div class="toast-stack" data-toast-stack aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/js/checkout.js"></script>
  </body>
</html>
