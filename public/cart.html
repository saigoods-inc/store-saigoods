<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart | SAI Goods Store</title>
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png?v=3" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" sizes="180x180" />
    <meta
      name="description"
      content="Review your SAI Goods cart order summary and proceed to secure checkout. Edit items on the product page."
    />
    <meta name="robots" content="noindex, follow" />
    <!-- Critical shell and render-blocking navigation styles. -->
    <style>
      :root {
        --bg: #f7f4ee;
        --text: #25242a;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 0.65rem 0;
        background: #fff;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .navbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 1.5rem;
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .section {
        padding: 1.5rem 0;
      }
      .shell {
        max-width: 72rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
    </style>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="page--cart">
    <div class="site-frame">
      <header data-site-header>
    <div class="site-header">
      <div class="shell navbar">
        <a class="brand-mark" href="/index.html#hero" aria-label="SAI Goods Store home">
          <img src="/img/nav-logo.svg" alt="SAI Goods Store logo" width="30" height="30" decoding="async" />
          <span class="brand-mark__name">SAI Goods, Inc.</span>
        </a>

        <div class="store-nav-backdrop" aria-hidden="true"></div>

        <nav class="store-nav" id="store-navigation" aria-label="Store navigation">
          <div class="store-nav__drawer-head">
            <button class="store-nav__close" type="button" aria-label="Close menu">
              <span aria-hidden="true"></span>
            </button>
          </div>
          <a href="/index.html#products">Shop</a>
          <a href="/contact">For business</a>
          <a href="#contact">Contact</a>
        </nav>

        <button class="store-nav-toggle" type="button" aria-controls="store-navigation" aria-expanded="false" aria-label="Open menu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>

        <a class="cart-link" aria-current="page" aria-disabled="true" aria-label="View cart">
          <span class="cart-link__icon">
          <img src="/img/cart-icon.svg" alt="" aria-hidden="true" width="22" height="22" decoding="async" />
          <span class="cart-link__count" data-cart-count hidden>0</span>
          </span>
        </a>
      </div>
    </div>
</header>

      <main class="section section--tight">
        <div class="shell">
          <a class="checkout-back" href="/index.html#products">← Back to shop</a>
          <div data-cart-root></div>
        </div>
      </main>

      <footer data-site-footer></footer>
    </div>

    <div class="toast-stack" data-toast-stack aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/js/cart.js"></script>
  </body>
</html>
