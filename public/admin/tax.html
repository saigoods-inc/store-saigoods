<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales tax (TN) — SAI Goods (staff)</title>
    <link rel="stylesheet" href="/css/admin-orders.css" />
  </head>
  <body class="admin-page">
    <div id="admin-login" class="admin-login" hidden>
      <div class="admin-login__box">
        <h1>Staff login</h1>
        <p class="admin-muted">Sign in with your Supabase account to view reports.</p>
        <form id="login-form">
          <label>
            Email
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="admin-error" role="alert" hidden></p>
          <button type="submit" class="admin-btn admin-btn--primary">Sign in</button>
        </form>
      </div>
    </div>

    <div id="admin-app" class="admin-app" hidden>
      <header class="admin-header">
        <div>
          <h1>Sales tax (Tennessee)</h1>
          <p class="admin-muted">Taxable base and tax collected by month (UTC) for TN destination orders.</p>
        </div>
        <div class="admin-header__actions">
          <span id="admin-user-email" class="admin-muted"></span>
          <button type="button" id="admin-logout" class="admin-btn">Sign out</button>
        </div>
      </header>

      <div id="admin-nav"></div>

      <div class="admin-toolbar">
        <button type="button" id="admin-refresh" class="admin-btn">Refresh</button>
      </div>

      <p id="tax-meta" class="admin-muted" style="margin-bottom: 0.75rem"></p>
      <p id="admin-load-error" class="admin-error" role="alert" hidden></p>
      <div id="admin-loading" class="admin-loading" hidden>Loading…</div>

      <div class="admin-table-wrap">
        <table class="admin-table" id="tax-table">
          <thead>
            <tr>
              <th>Month (UTC)</th>
              <th>State</th>
              <th>Taxable revenue</th>
              <th>Tax collected</th>
              <th>Orders</th>
            </tr>
          </thead>
          <tbody id="tax-tbody"></tbody>
        </table>
      </div>
    </div>

    <script type="module" src="/js/admin-tax.js"></script>
  </body>
</html>
