<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discount codes — SAI Goods (staff)</title>
    <link rel="stylesheet" href="/css/admin-orders.css" />
  </head>
  <body class="admin-page">
    <div id="admin-login" class="admin-login" hidden>
      <div class="admin-login__box">
        <h1>Staff login</h1>
        <p class="admin-muted">Sign in with your Supabase account to view Hardin County promo codes.</p>
        <form id="login-form">
          <label>
            Email
            <input type="email" name="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="admin-error" role="alert" hidden></p>
          <button type="submit" class="admin-btn admin-btn--primary">Sign in</button>
        </form>
      </div>
    </div>

    <div id="admin-app" class="admin-app" hidden>
      <header class="admin-header">
        <div class="admin-header__main">
          <h1>Hardin County discount codes</h1>
          <p class="admin-muted">One-time codes · unused codes can be shared with eligible Hardin County, TN customers.</p>
        </div>
        <div class="admin-header__actions">
          <span id="admin-user-email" class="admin-muted"></span>
          <button type="button" id="admin-logout" class="admin-btn">Sign out</button>
        </div>
      </header>

      <div id="admin-nav"></div>

      <div class="admin-toolbar admin-toolbar--wrap">
        <div class="admin-filter-field">
          <label class="admin-filter-field__label" for="filter-code-status">Status</label>
          <select id="filter-code-status">
            <option value="all">All</option>
            <option value="unused">Unused</option>
            <option value="used">Used</option>
          </select>
        </div>
        <label class="admin-filter admin-filter--grow">
          <span>Search code</span>
          <input type="search" id="filter-code-search" placeholder="Contains…" autocomplete="off" />
        </label>
        <div class="admin-filter-field">
          <label class="admin-filter-field__label" for="filter-code-sort">Sort</label>
          <select id="filter-code-sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="code_az">Code A–Z</option>
            <option value="code_za">Code Z–A</option>
          </select>
        </div>
        <button type="button" id="admin-refresh" class="admin-icon-btn admin-refresh-btn" aria-label="Refresh" title="Refresh">
          <svg class="admin-refresh-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
            />
          </svg>
        </button>
      </div>

      <p id="admin-load-error" class="admin-error" role="alert" hidden></p>
      <div id="admin-loading" class="admin-loading" hidden>Loading codes…</div>

      <div class="admin-table-wrap">
        <table class="admin-table" id="codes-table">
          <thead>
            <tr>
              <th>Code</th>
              <th>Status</th>
              <th>Used at</th>
              <th>Order ID</th>
            </tr>
          </thead>
          <tbody id="codes-tbody"></tbody>
        </table>
      </div>
    </div>

    <script type="module" src="/js/admin-discount-codes.js"></script>
  </body>
</html>
